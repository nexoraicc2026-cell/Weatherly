<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatherly</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #38bdf8;
        --accent-2: #67e8f9;
        --text: #e5f3ff;
        --muted: #a5b4c7;
        --shadow: rgba(15, 23, 42, 0.4);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #111827 50%, #1e293b 100%);
        color: var(--text);
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .card {
        width: min(820px, 100%);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        box-shadow: 0 24px 80px var(--shadow);
        padding: 48px 30px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(103, 232, 249, 0.3);
        color: var(--accent-2);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.25rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
        margin: 0 auto 28px;
        max-width: 620px;
      }

      .links {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 20px;
      }

      a.button {
        display: inline-block;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #082f49;
      }

      .secondary {
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="badge">Weatherly</div>
        <h1>Welcome to Weatherly</h1>
        <p>
          Your GitHub Pages site is now live. This is a simple landing page for the project,
          and it includes quick links to the privacy policy and data deletion information.
        </p>

        <div class="links">
          <a class="button primary" href="https://nexoraicc2026-cell.github.io/Weatherly/">Open site</a>
          <a class="button secondary" href="privacy-policy.html">Privacy Policy</a>
          <a class="button secondary" href="data-deletion.html">Data Deletion</a>
        </div>
      </div>
    </div>
  </body>
</html>
